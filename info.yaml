project:
  title: "PulseTrust"
  author: "Pak Troopers"
  discord: ""
  description: "Configurable pulse filter, saturating counter and missing-event alert for sensor nodes"
  language: "Verilog"
  clock_hz: 50000000
  tiles: "1x1"
  top_module: "tt_um_syedsaadhhh_pulsetrust"
  source_files:
    - "project.v"
pinout:
  ui[0]: "raw logic pulse"
  ui[1]: "filter code bit 0"
  ui[2]: "filter code bit 1"
  ui[3]: "filter code bit 2"
  ui[4]: "count enable"
  ui[5]: "synchronous clear"
  ui[6]: "window boundary"
  ui[7]: "count page select"
  uo[0]: "selected count bit 0"
  uo[1]: "selected count bit 1"
  uo[2]: "selected count bit 2"
  uo[3]: "selected count bit 3"
  uo[4]: "selected count bit 4"
  uo[5]: "selected count bit 5"
  uo[6]: "selected count bit 6"
  uo[7]: "selected count bit 7"
  uio[0]: "filtered level output"
  uio[1]: "accepted pulse strobe"
  uio[2]: "last window had rejected glitch"
  uio[3]: "last count below minimum"
  uio[4]: "last window overflowed"
  uio[5]: "window ready strobe"
  uio[6]: "count enabled"
  uio[7]: "reserved low"
yaml_version: 6
